services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  WapplerSystems\FormExtended\:
    resource: '../Classes/*'


  WapplerSystems\FormExtended\EventListener\DataStructureIdentifierListener:
    tags:
      - name: event.listener
        identifier: 'form-extended/modify-data-structure'
        method: 'modifyDataStructure'

  WapplerSystems\FormExtended\EventListener\ModifyFlexFormListener:
    tags:
      - name: event.listener
        event: TYPO3\CMS\Core\Configuration\Event\AfterFlexFormDataStructureParsedEvent
        identifier: 'form-extended/modify-form-flexform'
        after: 'form-framework/modify-data-structure'

  WapplerSystems\FormExtended\Mvc\Property\TypeConverter\TimeConverter:
    tags:
      - name: extbase.type_converter
        priority: 10
        target: WapplerSystems\FormExtended\DataType\Time
        sources: string

  WapplerSystems\FormExtended\Mvc\Property\TypeConverter\DateConverter:
    tags:
      - name: extbase.type_converter
        priority: 10
        target: WapplerSystems\FormExtended\DataType\Date
        sources: string

  WapplerSystems\FormExtended\EventListener\AfterYamlConfigurationLoadedEventListener:
    tags:
      - name: event.listener
        identifier: 'form-extended/after-yaml-configuration-loaded'
