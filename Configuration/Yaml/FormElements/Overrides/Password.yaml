prototypes:
  standard:
    formElementsDefinition:
      Password:
        __inheritances:
          70: TYPO3.CMS.Form.mixins.formElementMixins.ExtendedAttributesMixin
        properties:
          # Show the live password-policy indicator under the input. The
          # rules come from the TYPO3 FE password policy
          # ($GLOBALS['TYPO3_CONF_VARS']['FE']['passwordPolicy']), so what
          # the visitor sees lit up green is exactly what the server-side
          # validator will accept.
          showPasswordPolicy: true
          passwordPolicyHeading: 'Password must meet:'
        formEditor:
          editors:
            900:
              identifier: showPasswordPolicy
              templateName: Inspector-CheckboxEditor
              label: 'Show live password requirements'
              propertyPath: properties.showPasswordPolicy
            910:
              identifier: passwordPolicyHeading
              templateName: Inspector-TextEditor
              label: 'Password policy heading'
              propertyPath: properties.passwordPolicyHeading
              propertyValidators: { }
