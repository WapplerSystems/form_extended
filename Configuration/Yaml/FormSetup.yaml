formManager:
  translationFiles:
    27: 'EXT:form_extended/Resources/Private/Language/form.xlf'

prototypes:
  standard:
    formEditor:
      translationFiles:
        27: 'EXT:form_extended/Resources/Private/Language/form.xlf'
      formEditorPartials:
        FormElement-PrivacyPolicyCheckbox: Stage/SimpleTemplate
        FormElement-StaticText: Stage/SimpleTemplate
        Inspector-StaticTextEditor: Inspector/StaticTextEditor

      formEditorFluidConfiguration:
        partialRootPaths:
          780: 'EXT:form_extended/Resources/Private/Backend/Partials/FormEditor/'
        layoutRootPaths:
          780: 'EXT:form_extended/Resources/Private/Backend/Layouts/FormEditor/'

      dynamicRequireJsModules:
        additionalViewModelModules:
          90: '@wapplersystems/form_extended/backend/form-editor/view-model.js'


mixins:
  formElementMixins:
    ExtendedAttributesMixin:
      formEditor:
        editors:
          710:
            identifier: 'info'
            templateName: 'Inspector-TextareaEditor'
            label: formEditor.elements.ExtendedAttributesMixin.editor.info.label
            propertyPath: 'properties.info'
          750:
            identifier: 'hideTitle'
            templateName: 'Inspector-CheckboxEditor'
            label: formEditor.elements.ExtendedAttributesMixin.editor.hideTitle.label
            propertyPath: 'properties.hideTitle'
          920:
            identifier: 'mapOnDatabaseColumn'
            templateName: 'Inspector-TextEditor'
            label: formEditor.elements.ExtendedAttributesMixin.editor.mapOnDatabaseColumn.label
            propertyPath: 'properties.mapOnDatabaseColumn'
          921:
            identifier: 'emptyValueBehaviour'
            templateName: 'Inspector-SingleSelectEditor'
            label: formEditor.elements.ExtendedAttributesMixin.editor.emptyValueBehaviour.label
            propertyPath: 'properties.emptyValueBehaviour'
            selectOptions:
              10:
                value: 'skip'
                label: formEditor.elements.FormElement.editor.emptyValueBehaviour.option.skip
              15:
                value: 'defaultValue'
                label: formEditor.elements.FormElement.editor.emptyValueBehaviour.option.defaultValue
          922:
            identifier: 'saveFileIdentifierInsteadOfUid'
            templateName: 'Inspector-CheckboxEditor'
            label: formEditor.elements.ExtendedAttributesMixin.editor.saveFileIdentifierInsteadOfUid.label
            propertyPath: 'properties.saveFileIdentifierInsteadOfUid'
          923:
            identifier: 'function'
            templateName: 'Inspector-SingleSelectEditor'
            label: formEditor.elements.ExtendedAttributesMixin.editor.function.label
            propertyPath: 'properties.function'
            selectOptions:
              10:
                value: ''
                label: formEditor.elements.FormElement.editor.function.option.none
              20:
                value: 'time'
                label: formEditor.elements.FormElement.editor.function.option.time
