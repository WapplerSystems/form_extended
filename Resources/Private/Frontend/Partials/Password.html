<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" xmlns:formvh="http://typo3.org/ns/TYPO3/CMS/Form/ViewHelpers" data-namespace-typo3-fluid="true">
<formvh:renderRenderable renderable="{element}">
    <f:form.validationResults for="{element.rootForm.identifier}.{element.identifier}">
        <f:if condition="{element.properties.elementDescription}">
            <f:variable name="aria" value="{describedby: '{element.uniqueIdentifier}-desc'}" />
        </f:if>
        <f:if condition="{validationResults.errors}">
            <f:variable name="aria" value="{invalid: 'true', describedby: '{element.uniqueIdentifier}-errors'}" />
        </f:if>

        <f:render partial="Field/Field" arguments="{element: element}" contentAs="elementContent">
            <f:form.password
                property="{element.identifier}"
                id="{element.uniqueIdentifier}"
                class="{element.properties.elementClassAttribute}"
                additionalAttributes="{formvh:translateElementProperty(element: element, property: 'fluidAdditionalAttributes')}"
                errorClass="{element.rootForm.renderingOptions.fieldProperties.errorClassAttribute}"
                aria="{aria}"
            />

            <f:if condition="{element.properties.showPasswordPolicy} == 1">
                <div class="fe-password-policy" data-fe-password-policy data-target="{element.uniqueIdentifier}">
                    <p class="fe-password-policy__heading" data-heading="data-heading">
                        <f:variable name="passwordPolicyHeading">{formvh:translateElementProperty(element: element, property: 'passwordPolicyHeading')}</f:variable>
                        <f:if condition="{passwordPolicyHeading}">
                            <f:then>{passwordPolicyHeading}</f:then>
                            <f:else>Password must meet:</f:else>
                        </f:if>
                    </p>
                </div>
                <f:asset.script identifier="form_extended-password-policy" src="EXT:form_extended/Resources/Public/JavaScript/Frontend/password-policy.js" defer="defer" />
                <f:asset.css identifier="form_extended-password-policy" href="EXT:form_extended/Resources/Public/CSS/password-policy.css" />
            </f:if>
        </f:render>
    </f:form.validationResults>
</formvh:renderRenderable>
</html>
